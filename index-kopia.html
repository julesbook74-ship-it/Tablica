<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablica — wspólne notatki</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#202332;--muted:#73798c;--line:#e7e9f0;--accent:#635bff;--shadow:0 12px 35px rgba(31,35,58,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex}
.sidebar{width:260px;background:#171925;color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.logo{font-size:24px;font-weight:800;padding:4px 10px}.logo span{color:#8d86ff}
.new{background:#6d64ff;color:white;border-radius:13px;padding:12px 14px;font-weight:700}.boards{display:flex;flex-direction:column;gap:5px}.board{padding:11px 12px;border-radius:10px;color:#c9cbd7;display:flex;gap:10px;align-items:center}.board.active,.board:hover{background:#292b3b;color:white}
.user{margin-top:auto;background:#232536;border-radius:14px;padding:12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#8d86ff;font-weight:800}
.main{flex:1;min-width:0}.top{height:76px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.title{font-size:21px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:9px;align-items:center}.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.people{display:flex;align-items:center}.mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:3px solid white;margin-left:-7px;font-size:12px;font-weight:800}.mini:first-child{margin-left:0;background:#ffd76d}.mini:nth-child(2){background:#8fe1bd}.mini:nth-child(3){background:#a9b5ff}
.boardwrap{padding:28px;overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.search{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;width:240px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;align-items:start}
.note{border-radius:17px;padding:17px;min-height:190px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:10px}.yellow{background:#fff1a8}.pink{background:#ffd6e7}.blue{background:#d7e7ff}.green{background:#d7f4df}.purple{background:#e5dcff}.note input{background:transparent;border:0;font-weight:800;font-size:17px;outline:0;width:100%}.note textarea{background:transparent;border:0;resize:vertical;min-height:100px;outline:0;line-height:1.45;color:#35384a}.meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6f7180}.tag{background:rgba(255,255,255,.55);padding:5px 8px;border-radius:20px}.delete{background:rgba(255,255,255,.55);border-radius:8px;padding:5px 8px}.add{border:2px dashed #d5d8e3;background:transparent;box-shadow:none;display:grid;place-items:center;min-height:190px;color:#777d90;font-weight:700}.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}
.modalbg{position:fixed;inset:0;background:rgba(16,18,29,.45);display:none;align-items:center;justify-content:center;padding:20px}.modal{background:white;border-radius:20px;padding:25px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);font-size:14px}.code{font-size:30px;letter-spacing:7px;text-align:center;background:#f4f5fa;border-radius:13px;padding:15px;font-weight:900;margin:18px 0}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;margin:8px 0}.row{display:flex;gap:9px;margin-top:10px}.row>*{flex:1}
@media(max-width:750px){.sidebar{width:70px;padding:15px 9px}.logo{font-size:0}.logo span{font-size:24px}.new{font-size:0;text-align:center}.new:after{content:"+";font-size:22px}.board{justify-content:center;font-size:0}.user .name{display:none}.top{padding:0 15px}.boardwrap{padding:17px}.search{width:150px}.actions .btn{font-size:0}.actions .btn:before{content:"↗";font-size:17px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Ta<span>blica</span></div>
  <button class="new" onclick="newBoard()">＋ Nowa tablica</button>
  <div class="boards" id="boards"></div>
  <div class="user"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">J</div><div class="name"><b>Ja</b><div style="font-size:11px;color:#aeb1c0">online</div></div></div></div>
</aside>
<main class="main">
<header class="top">
  <div><div class="title" id="boardTitle"></div><div class="sub">Wspólna tablica • zapis automatyczny</div></div>
  <div class="actions"><div class="people"><div class="mini">J</div><div class="mini">A</div></div><button class="btn" onclick="invite()">👥 Zaproś</button><button class="btn primary" onclick="addNote()">＋ Notatka</button></div>
</header>
<section class="boardwrap">
 <div class="toolbar"><b>Notatki</b><input class="search" id="search" placeholder="Szukaj..." oninput="render()"></div>
 <div class="grid" id="grid"></div>
</section>
</main>
</div>

<div class="modalbg" id="modal">
 <div class="modal"><h2>Udostępnij tablicę</h2><p>Wyślij ten kod drugiej osobie. W wersji online kod będzie służył do wejścia na tę samą tablicę.</p><div class="code" id="roomCode"></div><input class="field" id="joinCode" placeholder="Kod zaproszenia"><div class="row"><button class="btn" onclick="closeModal()">Zamknij</button><button class="btn primary" onclick="join()">Dołącz</button></div></div>
</div>
<script>
const KEY='tablica-demo-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 boards:[{id:'b1',name:'Moja tablica',notes:[
 {id:1,title:'Pomysł na projekt',body:'Tutaj możemy razem zapisać najważniejsze pomysły.',color:'yellow'},
 {id:2,title:'Do zrobienia',body:'• przygotować materiały\\n• podzielić zadania\\n• ustalić termin',color:'green'},
 {id:3,title:'Ważne',body:'Nie zapomnieć o spotkaniu w piątek.',color:'pink'}
 ]}],active:'b1'
};
const colors=['yellow','pink','blue','green','purple'];
let channel;
try{channel=new BroadcastChannel('tablica-room')}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(state));if(channel)channel.postMessage(state)}
if(channel)channel.onmessage=e=>{state=e.data;render()};
function active(){return state.boards.find(b=>b.id===state.active)}
function renderBoards(){document.getElementById('boards').innerHTML=state.boards.map(b=>`<div class="board ${b.id===state.active?'active':''}" onclick="selectBoard('${b.id}')">▦ <span>${escapeHtml(b.name)}</span></div>`).join('')}
function render(){renderBoards();const b=active();document.getElementById('boardTitle').textContent=b.name;const q=document.getElementById('search').value.toLowerCase();const notes=b.notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));document.getElementById('grid').innerHTML=notes.map(n=>`
<div class="note ${n.color}">
 <input value="${escapeAttr(n.title)}" oninput="edit(${n.id},'title',this.value)">
 <textarea oninput="edit(${n.id},'body',this.value)">${escapeHtml(n.body)}</textarea>
 <div class="meta"><span class="tag">wspólna notatka</span><button class="delete" onclick="removeNote(${n.id})">Usuń</button></div>
</div>`).join('')+`<button class="note add" onclick="addNote()">＋ Dodaj notatkę</button>`}
function edit(id,key,val){let n=active().notes.find(x=>x.id===id);if(n){n[key]=val;save()}}
function addNote(){active().notes.unshift({id:Date.now(),title:'Nowa notatka',body:'Zacznij pisać...',color:colors[Math.floor(Math.random()*colors.length)]});save();render()}
function removeNote(id){active().notes=active().notes.filter(n=>n.id!==id);save();render()}
function selectBoard(id){state.active=id;save();render()}
function newBoard(){let name=prompt('Nazwa nowej tablicy:','Nowy projekt');if(!name)return;let id='b'+Date.now();state.boards.push({id,name,notes:[]});state.active=id;save();render()}
function invite(){document.getElementById('roomCode').textContent='TAB-'+active().id.toUpperCase().replace('B','');document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function join(){const code=document.getElementById('joinCode').value.trim();if(code){alert('W prototypie kod jest prezentowany jako demonstracja. W wersji online dołączenie będzie synchronizować tablicę między urządzeniami.');closeModal()}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
render();
</script>
</body></html>
