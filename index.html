<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tablica – wspólny zeszyt</title>
<style>
:root{--ink:#202332;--muted:#697087;--line:#e4e7ef;--accent:#635bff}
*{box-sizing:border-box}
body{margin:0;background:#f1f3f8;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:white;border-bottom:1px solid var(--line);padding:12px;position:relative;z-index:5}
.brand{font-weight:800;font-size:21px;margin-bottom:10px}.brand span{color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:var(--ink)}
button.active{background:#e9e7ff;border-color:var(--accent);color:#443bd0}
button:disabled{opacity:.45;cursor:default}
input[type=color]{width:38px;height:38px;padding:3px;border:1px solid var(--line);border-radius:9px;background:white}
input[type=range]{width:85px}
main{max-width:1100px;margin:auto;padding:12px}
.info{font-size:13px;color:var(--muted);margin:5px 2px 12px;line-height:1.45}
.pagebar{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0}
.sheet-wrap{overflow-y:auto;overflow-x:hidden;display:flex;justify-content:center;align-items:flex-start;padding:5px 0 25px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:75vh;touch-action:pan-y}
.sheet{position:relative;width:min(900px,96vw);height:min(1160px,125vw);min-height:520px;flex-shrink:0;background-color:white;background-image:linear-gradient(#dce7f4 1px,transparent 1px),linear-gradient(90deg,#dce7f4 1px,transparent 1px);background-size:24px 24px;box-shadow:0 5px 25px #20233220;border:1px solid #d9deea;overflow:hidden}
#pdfBackground{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1;pointer-events:none}
#photoLayer{position:absolute;inset:0;z-index:2;pointer-events:none}
.photo{position:absolute;user-select:none;-webkit-user-drag:none;max-width:none;touch-action:none}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;touch-action:none}
#drawCanvas.photo-mode{pointer-events:none}
#photoLayer.editing{pointer-events:auto}
.photo.selected{outline:2px solid var(--accent);outline-offset:1px}
.resize-handle{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid white;right:-10px;bottom:-10px;z-index:3;touch-action:none}
#emptyHint{position:absolute;top:18px;left:20px;color:#a0a7b7;font-size:13px;pointer-events:none;z-index:3}
footer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 10px 25px}
#status{font-size:12px;color:var(--muted);text-align:center;min-height:18px;margin:0 8px 8px}
.hidden{display:none!important}
@media(max-width:600px){header{padding:9px}.brand{font-size:19px}.tools{gap:5px}.tools button{padding:8px 9px;font-size:13px}.sheet{height:130vw;min-height:500px}}
</style>
</head>
<body>
<header>
<div class="brand">Ta<span>blica</span> – wspólny zeszyt</div>
<div class="tools">
<button id="pen" class="active">✒️ Długopis</button>
<button id="highlighter">🖍️ Zakreślacz</button>
<button id="eraser">🧽 Gumka</button>
<input id="color" type="color" value="#202332" aria-label="Kolor pisania">
<label>Grubość <input id="size" type="range" min="1" max="18" value="3"></label>
<button id="undo">↶ Cofnij</button>
<button id="redo">↷ Ponów</button>
<button id="addPhoto">🖼️ Dodaj zdjęcie</button>
<button id="editPhotos">↔️ Przesuń zdjęcie</button>
<button id="openPdf">📄 Otwórz PDF</button>
</div>
<input id="photoInput" class="hidden" type="file" accept="image/*">
<input id="pdfInput" class="hidden" type="file" accept="application/pdf,.pdf">
</header>
<main>
<div class="info">Pisz rysikiem, a palcem przewijaj kartkę. Zdjęcie dodasz przyciskiem „Dodaj zdjęcie”, a potem możesz je przesuwać i zmieniać jego rozmiar. PDF zostanie dodany jako kolejne strony zeszytu. Zapis odbywa się automatycznie w tej przeglądarce.</div>
<div class="pagebar">
<button id="prev">← Poprzednia</button>
<b id="pageLabel">Strona 1</b>
<button id="next">Następna →</button>
<button id="addPage">＋ Nowa strona</button>
</div>
<div class="sheet-wrap" id="sheetWrap">
<div class="sheet" id="sheet">
<img id="pdfBackground" alt="" class="hidden">
<div id="photoLayer"></div>
<div id="emptyHint">Zacznij pisać rysikiem...</div>
<canvas id="drawCanvas"></canvas>
</div>
</div>
<div id="status" role="status"></div>
</main>
<footer>
<button id="clear">🗑️ Wyczyść stronę</button>
<button id="download">⬇ Pobierz stronę PNG</button>
<button id="exportPdf">📚 Pobierz cały zeszyt PDF</button>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
"use strict";
const draw=document.getElementById("drawCanvas"),ctx=draw.getContext("2d");
const sheet=document.getElementById("sheet"),wrap=document.getElementById("sheetWrap");
const KEY="tablica-notebook-v2", $=id=>document.getElementById(id);
let pages=[],page=0,tool="pen",drawing=false,current=null,activePenId=null;
let fingerScrolling=false,fingerId=null,fingerLastY=0,redoStack=[],photoMode=false,selectedPhoto=null;
const say=t=>{$("status").textContent=t;};
function blank(){return{strokes:[],photos:[],pdfBackground:null}}
function normalize(p){if(!p||typeof p!=="object")p=blank();if(!Array.isArray(p.strokes))p.strokes=[];if(!Array.isArray(p.photos))p.photos=[];if(!("pdfBackground" in p))p.pdfBackground=null;return p}
try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&Array.isArray(saved.pages)){pages=saved.pages.map(normalize);page=Math.max(0,Math.min(Number(saved.page)||0,pages.length-1));}}catch(e){}
if(!pages.length)pages=[blank()];
pages=pages.map(normalize);
function save(){try{localStorage.setItem(KEY,JSON.stringify({pages,page}));}catch(e){say("Pamięć przeglądarki jest pełna. Usuń duże zdjęcia lub pobierz zeszyt PDF.");}}
function fit(){const r=sheet.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);draw.width=Math.round(r.width*dpr);draw.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);redraw();}
function paintStroke(c,s){if(!s.points||!s.points.length)return;c.save();c.lineCap="round";c.lineJoin="round";c.strokeStyle=s.color;c.lineWidth=s.tool==="highlighter"?s.size*3:s.size;c.globalAlpha=s.tool==="highlighter"?.25:1;if(s.tool==="eraser"){c.globalCompositeOperation="destination-out";c.globalAlpha=1;}c.beginPath();c.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length;i++)c.lineTo(s.points[i].x,s.points[i].y);if(s.points.length===1)c.lineTo(s.points[0].x+.1,s.points[0].y+.1);c.stroke();c.restore();}
function redraw(){const r=sheet.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);pages[page].strokes.forEach(s=>paintStroke(ctx,s));$("pageLabel").textContent="Strona "+(page+1)+" z "+pages.length;$("emptyHint").style.display=pages[page].strokes.length===0&&!pages[page].photos.length&&!pages[page].pdfBackground?"block":"none";renderPageLayers();}
function renderPageLayers(){
 const p=pages[page];$("pdfBackground").src=p.pdfBackground||"";$("pdfBackground").classList.toggle("hidden",!p.pdfBackground);
 const layer=$("photoLayer");layer.innerHTML="";layer.classList.toggle("editing",photoMode);draw.classList.toggle("photo-mode",photoMode);
 p.photos.forEach((ph,i)=>{const box=document.createElement("div");box.style.position="absolute";box.style.left=(ph.x*100)+"%";box.style.top=(ph.y*100)+"%";box.style.width=(ph.w*100)+"%";box.style.height=(ph.h*100)+"%";box.style.zIndex="2";box.dataset.index=i;
 const img=document.createElement("img");img.className="photo"+(selectedPhoto===i&&photoMode?" selected":"");img.src=ph.src;img.style.inset="0";img.style.width="100%";img.style.height="100%";img.style.objectFit="contain";img.draggable=false;box.appendChild(img);
 if(photoMode&&selectedPhoto===i){const h=document.createElement("div");h.className="resize-handle";h.title="Zmień rozmiar";box.appendChild(h);h.addEventListener("pointerdown",e=>startPhotoGesture(e,i,true));}
 box.addEventListener("pointerdown",e=>{if(!photoMode)return;if(e.target.classList.contains("resize-handle"))return;if(selectedPhoto!==i){selectedPhoto=i;renderPageLayers();return;}startPhotoGesture(e,i,false);});layer.appendChild(box);});
}
function pos(e){const r=draw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function addPoints(e){let events=[e];if(typeof e.getCoalescedEvents==="function"){const extra=e.getCoalescedEvents();if(extra.length)events=extra;}events.forEach(ev=>{const p=pos(ev);current.points.push(p);const pts=current.points;paintStroke(ctx,{tool:current.tool,color:current.color,size:current.size,points:[pts[pts.length-2]||p,p]});});}
draw.addEventListener("pointerdown",e=>{
 if(photoMode)return;
 if(e.pointerType==="touch"){if(drawing)return;fingerScrolling=true;fingerId=e.pointerId;fingerLastY=e.clientY;try{draw.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault();return;}
 if(e.pointerType!=="pen"&&e.pointerType!=="mouse")return;if(drawing)return;e.preventDefault();activePenId=e.pointerId;try{draw.setPointerCapture(e.pointerId)}catch(err){}drawing=true;current={tool,color:tool==="eraser"?"#ffffff":$("color").value,size:Number($("size").value),points:[pos(e)]};paintStroke(ctx,current);
});
draw.addEventListener("pointermove",e=>{if(fingerScrolling&&e.pointerId===fingerId){e.preventDefault();const delta=fingerLastY-e.clientY;wrap.scrollTop+=delta;fingerLastY=e.clientY;return;}if(!drawing||!current||e.pointerId!==activePenId)return;e.preventDefault();addPoints(e);});
function endDrawing(e){if(e&&e.pointerId!==activePenId)return;if(!drawing||!current)return;drawing=false;pages[page].strokes.push(current);current=null;activePenId=null;redoStack=[];save();$("emptyHint").style.display="none";}
draw.addEventListener("pointerup",e=>{if(fingerScrolling&&e.pointerId===fingerId){fingerScrolling=false;fingerId=null;return;}endDrawing(e);});
draw.addEventListener("pointercancel",e=>{if(fingerScrolling&&e.pointerId===fingerId){fingerScrolling=false;fingerId=null;return;}endDrawing(e);});
function choose(t){tool=t;["pen","highlighter","eraser"].forEach(id=>$(id).classList.toggle("active",id===t));}
$("pen").onclick=()=>choose("pen");$("highlighter").onclick=()=>choose("highlighter");$("eraser").onclick=()=>choose("eraser");
$("undo").onclick=()=>{const s=pages[page].strokes.pop();if(s){redoStack.push({page,stroke:s});save();redraw();}};
$("redo").onclick=()=>{const x=redoStack.pop();if(x&&x.page===page){pages[page].strokes.push(x.stroke);save();redraw();}};
$("clear").onclick=()=>{if(confirm("Czy na pewno wyczyścić całą stronę, razem ze zdjęciami i tłem PDF?")){pages[page]=blank();redoStack=[];selectedPhoto=null;save();redraw();}};
function go(n){page=Math.max(0,Math.min(pages.length-1,n));selectedPhoto=null;save();redraw();wrap.scrollTop=0;}
$("prev").onclick=()=>go(page-1);$("next").onclick=()=>go(page+1);$("addPage").onclick=()=>{pages.splice(page+1,0,blank());go(page+1);};
$("addPhoto").onclick=()=>$("photoInput").click();
$("photoInput").addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")){say("Wybierz plik ze zdjęciem.");return;}try{const data=await imageToDataURL(f);const img=new Image();img.onload=()=>{const ratio=img.width/img.height;let w=.62,h=w/ratio;if(h>.65){h=.65;w=h*ratio;}pages[page].photos.push({src:data,x:(1-w)/2,y:(1-h)/2,w,h});selectedPhoto=pages[page].photos.length-1;save();setPhotoMode(true);say("Zdjęcie dodane. W trybie „Przesuń zdjęcie” możesz je przesuwać i zmieniać rozmiar.");redraw();};img.src=data;}catch(err){say("Nie udało się dodać zdjęcia.");}e.target.value="";});
function imageToDataURL(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.86));};im.src=reader.result;};reader.readAsDataURL(file);});}
function setPhotoMode(on){photoMode=on;$("editPhotos").classList.toggle("active",on);$("editPhotos").textContent=on?"✓ Zakończ przesuwanie":"↔️ Przesuń zdjęcie";renderPageLayers();}
$("editPhotos").onclick=()=>{setPhotoMode(!photoMode);say(photoMode?"Dotknij zdjęcia i przeciągnij. Niebieski uchwyt zmienia rozmiar.":"Tryb przesuwania zdjęć wyłączony.");};
let gesture=null;
function startPhotoGesture(e,index,resize){if(!photoMode)return;e.preventDefault();e.stopPropagation();selectedPhoto=index;const r=sheet.getBoundingClientRect(),ph=pages[page].photos[index];gesture={index,resize,startX:e.clientX,startY:e.clientY,x:ph.x,y:ph.y,w:ph.w,h:ph.h,sw:r.width,sh:r.height};try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}}
document.addEventListener("pointermove",e=>{if(!gesture)return;const g=gesture,ph=pages[page].photos[g.index],dx=(e.clientX-g.startX)/g.sw,dy=(e.clientY-g.startY)/g.sh;if(g.resize){ph.w=Math.max(.08,Math.min(.95,g.w+dx));ph.h=Math.max(.08,Math.min(.95,g.h+dy));}else{ph.x=Math.max(0,Math.min(1-ph.w,g.x+dx));ph.y=Math.max(0,Math.min(1-ph.h,g.y+dy));}const box=$("photoLayer").children[g.index];if(box){box.style.left=(ph.x*100)+"%";box.style.top=(ph.y*100)+"%";box.style.width=(ph.w*100)+"%";box.style.height=(ph.h*100)+"%";}});
document.addEventListener("pointerup",()=>{if(gesture){gesture=null;save();}});
$("openPdf").onclick=()=>$("pdfInput").click();
$("pdfInput").addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.includes("pdf")&&!file.name.toLowerCase().endsWith(".pdf")){say("Wybierz dokument PDF.");return;}if(!window.pdfjsLib){say("Nie udało się załadować czytnika PDF. Sprawdź połączenie z internetem i odśwież stronę.");e.target.value="";return;}try{say("Wczytuję PDF…");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const bytes=await file.arrayBuffer(),doc=await pdfjsLib.getDocument({data:bytes}).promise;const added=[];for(let n=1;n<=doc.numPages;n++){const pdfPage=await doc.getPage(n),vp=pdfPage.getViewport({scale:1.5}),c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);await pdfPage.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;added.push({strokes:[],photos:[],pdfBackground:c.toDataURL("image/jpeg",.88)});}pages.splice(page+1,0,...added);go(page+1);say("Dodano "+added.length+" stron z PDF. Możesz teraz pisać po dokumencie rysikiem.");}catch(err){console.error(err);say("Nie udało się otworzyć PDF. Spróbuj z mniejszym dokumentem.");}e.target.value="";});
function drawPageToCanvas(p,w=900,h=1160){return new Promise((resolve,reject)=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);const finish=()=>{const step=24*w/(sheet.clientWidth||900);x.strokeStyle="#dce7f4";x.lineWidth=1;for(let xx=0;xx<w;xx+=step){x.beginPath();x.moveTo(xx,0);x.lineTo(xx,h);x.stroke();}for(let yy=0;yy<h;yy+=step){x.beginPath();x.moveTo(0,yy);x.lineTo(w,yy);x.stroke();}const drawStrokes=async()=>{const sx=w/(sheet.clientWidth||900),sy=h/(sheet.clientHeight||1160);x.save();x.scale(sx,sy);p.strokes.forEach(s=>paintStroke(x,s));x.restore();try{await Promise.all(p.photos.map(ph=>new Promise(done=>{const im=new Image();im.onload=()=>{x.drawImage(im,ph.x*w,ph.y*h,ph.w*w,ph.h*h);done();};im.onerror=done;im.src=ph.src;})));}catch(e){}resolve(c);};drawStrokes();};if(p.pdfBackground){const im=new Image();im.onload=()=>{x.drawImage(im,0,0,w,h);finish();};im.onerror=()=>{finish();};im.src=p.pdfBackground;}else finish();});}
$("exportPdf").onclick=async()=>{if(!window.jspdf||!window.jspdf.jsPDF){say("Nie udało się załadować eksportu PDF. Sprawdź internet i odśwież stronę.");return;}const btn=$("exportPdf");btn.disabled=true;try{say("Przygotowuję PDF…");const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});for(let i=0;i<pages.length;i++){if(i)pdf.addPage();const c=await drawPageToCanvas(pages[i]);pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,210,297);say("Dodaję stronę "+(i+1)+" z "+pages.length+"…");}pdf.save("Moj-zeszyt-Tablica.pdf");say("Gotowe! Zeszyt PDF został pobrany.");}catch(err){console.error(err);say("Nie udało się utworzyć PDF. Spróbuj wyeksportować mniej stron naraz.");}finally{btn.disabled=false;}};
$("download").onclick=async()=>{try{const c=await drawPageToCanvas(pages[page],Math.round(sheet.clientWidth*2),Math.round(sheet.clientHeight*2));const a=document.createElement("a");a.download="tablica-strona-"+(page+1)+".png";a.href=c.toDataURL("image/png");a.click();}catch(e){say("Nie udało się pobrać PNG.");}};
window.addEventListener("resize",fit);fit();redraw();
})();
</script>
</body>
</html>
