<!DOCTYPE html><html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Tablica – wspólny zeszyt</title><style>
:root {
  --ink:#202332;
  --muted:#697087;
  --line:#e4e7ef;
  --accent:#635bff;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:#f1f3f8;
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

header {
  background:white;
  border-bottom:1px solid var(--line);
  padding:12px;
}

.brand {
  font-weight:800;
  font-size:21px;
  margin-bottom:10px;
}

.brand span {
  color:var(--accent);
}

.tools {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  align-items:center;
}

button {
  font:inherit;
  cursor:pointer;
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:9px 12px;
  color:var(--ink);
}

button.active {
  background:#e9e7ff;
  border-color:var(--accent);
  color:#443bd0;
}

input[type=color] {
  width:38px;
  height:38px;
  padding:3px;
  border:1px solid var(--line);
  border-radius:9px;
  background:white;
}

input[type=range] {
  width:85px;
}

main {
  max-width:1100px;
  margin:auto;
  padding:12px;
}

.info {
  font-size:13px;
  color:var(--muted);
  margin:5px 2px 12px;
}

.pagebar {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  margin:12px 0;
}

.sheet-wrap {
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:5px 0 25px;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  max-height:75vh;
}

.sheet {
  position:relative;
  width:min(900px,96vw);
  height:min(1160px,125vw);
  min-height:520px;
  flex-shrink:0;
  background-color:white;

  background-image:
    linear-gradient(#dce7f4 1px,transparent 1px),
    linear-gradient(90deg,#dce7f4 1px,transparent 1px);

  background-size:24px 24px;

  box-shadow:0 5px 25px #20233220;
  border:1px solid #d9deea;
}

canvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#drawCanvas {
  z-index:2;
  touch-action:none;
}

#emptyHint {
  position:absolute;
  top:18px;
  left:20px;
  color:#a0a7b7;
  font-size:13px;
  pointer-events:none;
  z-index:1;
}

footer {
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  padding:0 10px 25px;
}

input[type=file] {
  display:none;
}

@media(max-width:600px) {
  header {
    padding:9px;
  }

  .brand {
    font-size:19px;
  }

  .tools {
    gap:5px;
  }

  .tools button {
    padding:8px 9px;
    font-size:13px;
  }

  .sheet {
    height:130vw;
    min-height:500px;
  }
}
</style></head><body><header><div class="brand">
Ta<span>blica</span> – wspólny zeszyt
</div><div class="tools"><button id="pen" class="active">✒️ Długopis</button>
<button id="highlighter">🖍️ Zakreślacz</button>
<button id="eraser">🧽 Gumka</button>

<input id="color" type="color" value="#202332"><label>
Grubość
<input id="size" type="range" min="1" max="18" value="3">
</label><button id="undo">↶ Cofnij</button>
<button id="redo">↷ Ponów</button>

</div>
</header><main><div class="info">
Rysik służy do pisania pod dowolnym kątem.
Palcem możesz przesuwać kartkę.
Notatki zapisują się automatycznie.
</div><div class="pagebar"><button id="prev">← Poprzednia</button>
<b id="pageLabel">Strona 1</b>
<button id="next">Następna →</button>
<button id="addPage">＋ Nowa strona</button>

</div><div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"><div id="emptyHint">
Zacznij pisać rysikiem...
</div><canvas id="drawCanvas"></canvas>

</div></div></main><footer><button id="clear">🗑️ Wyczyść stronę</button>
<button id="download">⬇ Pobierz stronę PNG</button>

</footer><script>

(() => {

const draw = document.getElementById("drawCanvas");
const ctx = draw.getContext("2d");
const sheet = document.getElementById("sheet");
const wrap = document.getElementById("sheetWrap");

const KEY = "tablica-notebook-v2";

const $ = id => document.getElementById(id);

let pages = [];
let page = 0;
let tool = "pen";

let drawing = false;
let current = null;
let activePenId = null;

let fingerScrolling = false;
let fingerId = null;
let fingerLastY = 0;

let redoStack = [];

function blank() {
  return { strokes:[] };
}

// Odczyt zapisanych stron

try {

  const saved = JSON.parse(
    localStorage.getItem(KEY) || "null"
  );

  if(saved && Array.isArray(saved.pages)) {

    pages = saved.pages;

    page = Math.min(
      saved.page || 0,
      pages.length - 1
    );

  }

} catch(e) {}

if(!pages.length) {
  pages = [blank()];
}

// Zapis

function save() {

  try {

    localStorage.setItem(
      KEY,
      JSON.stringify({
        pages:pages,
        page:page
      })
    );

  } catch(e) {

    alert("Brak miejsca na zapis. Pobierz ważne strony jako PNG.");

  }

}

// Dopasowanie płótna

function fit() {

  const r = sheet.getBoundingClientRect();

  const dpr = Math.max(
    1,
    window.devicePixelRatio || 1
  );

  draw.width = Math.round(r.width * dpr);
  draw.height = Math.round(r.height * dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);

  redraw();

}

// Rysowanie śladów

function paintStroke(c,s) {

  if(!s.points || !s.points.length) return;

  c.save();

  c.lineCap = "round";
  c.lineJoin = "round";

  c.strokeStyle = s.color;

  c.lineWidth =
    s.tool === "highlighter"
      ? s.size * 3
      : s.size;

  c.globalAlpha =
    s.tool === "highlighter" ? 0.25 : 1;

  if(s.tool === "eraser") {
    c.globalCompositeOperation = "destination-out";
    c.globalAlpha = 1;
  }

  c.beginPath();

  c.moveTo(s.points[0].x,s.points[0].y);

  for(let i=1;i<s.points.length;i++) {
    c.lineTo(s.points[i].x,s.points[i].y);
  }

  if(s.points.length === 1) {
    c.lineTo(
      s.points[0].x + 0.1,
      s.points[0].y + 0.1
    );
  }

  c.stroke();
  c.restore();

}

// Odświeżanie

function redraw() {

  const r = sheet.getBoundingClientRect();

  ctx.clearRect(0,0,r.width,r.height);

  pages[page].strokes.forEach(s => {
    paintStroke(ctx,s);
  });

  $("pageLabel").textContent = "Strona " + (page+1);

  $("emptyHint").style.display =
    pages[page].strokes.length === 0 ? "block" : "none";

}

// Pozycja

function pos(e) {

  const r = draw.getBoundingClientRect();

  return {
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };

}

// Dodawanie punktów rysika

function addPoints(e) {

  let events = [e];

  if(typeof e.getCoalescedEvents === "function") {

    const extra = e.getCoalescedEvents();

    if(extra.length) events = extra;

  }

  events.forEach(ev => {

    const p = pos(ev);

    current.points.push(p);

    paintStroke(ctx,{
      tool:current.tool,
      color:current.color,
      size:current.size,
      points:[
        current.points[current.points.length-2] || p,
        p
      ]
    });

  });

}

// Rozpoczęcie rysowania

draw.addEventListener("pointerdown",e => {

  if(e.pointerType === "touch") {

    if(drawing) return;

    fingerScrolling = true;
    fingerId = e.pointerId;
    fingerLastY = e.clientY;

    try {
      draw.setPointerCapture(e.pointerId);
    } catch(err) {}

    e.preventDefault();
    return;
  }

  if(e.pointerType !== "pen" && e.pointerType !== "mouse") {
    return;
  }

  if(drawing) return;

  e.preventDefault();

  activePenId = e.pointerId;

  try {
    draw.setPointerCapture(e.pointerId);
  } catch(err) {}

  drawing = true;

  current = {

    tool:tool,

    color:
      tool === "eraser"
        ? "#ffffff"
        : $("color").value,

    size:Number($("size").value),

    points:[pos(e)]

  };

  paintStroke(ctx,current);

});

// Ruch

draw.addEventListener("pointermove",e => {

  // Przewijanie palcem

  if(fingerScrolling && e.pointerId === fingerId) {

    e.preventDefault();

    const delta = fingerLastY - e.clientY;

    wrap.scrollTop += delta;

    fingerLastY = e.clientY;

    return;
  }

  // Pisanie rysikiem

  if(!drawing || !current || e.pointerId !== activePenId) {
    return;
  }

  e.preventDefault();

  addPoints(e);

});

// Koniec pisania

function endDrawing(e) {

  if(e && e.pointerId !== activePenId) return;

  if(!drawing || !current) return;

  drawing = false;

  pages[page].strokes.push(current);

  current = null;
  activePenId = null;

  redoStack = [];

  save();

  $("emptyHint").style.display = "none";

}

draw.addEventListener("pointerup",e => {

  if(fingerScrolling && e.pointerId === fingerId) {

    fingerScrolling = false;
    fingerId = null;
    return;

  }

  endDrawing(e);

});

draw.addEventListener("pointercancel",e => {

  if(fingerScrolling && e.pointerId === fingerId) {

    fingerScrolling = false;
    fingerId = null;
    return;

  }

  endDrawing(e);

});

// Narzędzia

function choose(t) {

  tool = t;

  ["pen","highlighter","eraser"].forEach(id => {

    $(id).classList.toggle("active",id === t);

  });

}

$("pen").onclick = () => choose("pen");
$("highlighter").onclick = () => choose("highlighter");
$("eraser").onclick = () => choose("eraser");

// Cofanie

$("undo").onclick = () => {

  const s = pages[page].strokes.pop();

  if(s) {

    redoStack.push({
      page:page,
      stroke:s
    });

    save();
    redraw();

  }

};

// Ponawianie

$("redo").onclick = () => {

  const x = redoStack.pop();

  if(x && x.page === page) {

    pages[page].strokes.push(x.stroke);

    save();
    redraw();

  }

};

// Czyszczenie

$("clear").onclick = () => {

  if(confirm("Czy na pewno wyczyścić całą stronę?")) {

    pages[page] = blank();

    redoStack = [];

    save();
    redraw();

  }

};

// Zmiana strony

function go(n) {

  page = Math.max(0,Math.min(pages.length-1,n));

  save();
  redraw();

  wrap.scrollTop = 0;

}

$("prev").onclick = () => go(page-1);
$("next").onclick = () => go(page+1);

// Nowa strona

$("addPage").onclick = () => {

  pages.splice(page+1,0,blank());

  go(page+1);

};

// Pobieranie PNG

$("download").onclick = () => {

  const output = document.createElement("canvas");

  output.width = draw.width;
  output.height = draw.height;

  const octx = output.getContext("2d");

  octx.fillStyle = "white";
  octx.fillRect(0,0,output.width,output.height);

  const dpr = Math.max(1,window.devicePixelRatio || 1);

  const step = 24*dpr;

  octx.strokeStyle = "#dce7f4";
  octx.lineWidth = dpr;

  for(let x=0;x<output.width;x+=step) {

    octx.beginPath();
    octx.moveTo(x,0);
    octx.lineTo(x,output.height);
    octx.stroke();

  }

  for(let y=0;y<output.height;y+=step) {

    octx.beginPath();
    octx.moveTo(0,y);
    octx.lineTo(output.width,y);
    octx.stroke();

  }

  octx.drawImage(draw,0,0);

  const a = document.createElement("a");

  a.download = "tablica-strona-"+(page+1)+".png";
  a.href = output.toDataURL("image/png");
  a.click();

};

// Zmiana rozmiaru

window.addEventListener("resize",fit);

fit();

})();

</script></body>
</html>
